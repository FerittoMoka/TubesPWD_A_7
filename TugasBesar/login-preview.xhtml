<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <title>Masuk - Dolan Jogja</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="assets/css/auth.css" />
    <style type="text/css">body { margin: 0; }</style>
</head>
<body>
    <div class="wadah">
        <div class="kotak">
            <a href="index.xhtml" class="brand-auth">Dolan Jogja</a>
            <h1>Masuk</h1>
            <!-- Contoh pesan galat (tampil saat login gagal):
            <p class="error">Username/email atau password salah.</p> -->
            <form method="post" action="#" class="form-isi" onsubmit="return false;">
                <p>
                    <label for="login">Username atau Email</label>
                    <input type="text" id="login" name="login" required="required" />
                </p>
                <p>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required="required" />
                </p>
                <input type="submit" value="Masuk" />
            </form>
            <p>Belum punya akun? <a href="register-preview.xhtml">Daftar</a></p>
        </div>
    </div>
</body>
</html>
