<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="id" xml:lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Pilihan - Tugas Besar PWD</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/detail.css" />
</head>
<body>

    <nav class="navbar">
        <a href="index.xhtml" class="back-link">&#8592; Kembali ke Beranda</a>
    </nav>

    <main class="detail-container">
        <div class="detail-card">
            <div class="detail-image-wrapper">
                <img id="detail-img" src="assets/img/placeholder.jpg" alt="Gambar Detail" />
            </div>

            <div class="detail-content">
                <span id="detail-category" class="badge">Kategori</span>
                <h1 id="detail-title">Memuat Judul...</h1>
                <p id="detail-meta" class="meta-info">Info Tambahan &#8226; Lokasi / Harga</p>

                <hr class="divider" />

                <h3>Deskripsi Lengkap</h3>
                <p id="detail-desc">Memuat informasi lengkap mengenai pilihan yang Anda klik...</p>

                <div class="detail-highlights">
                    <h4>Informasi Utama:</h4>
                    <ul id="detail-list">
                        <li>Memuat poin informasi...</li>
                    </ul>
                </div>

                <div class="detail-actions">
                    <button id="btn-action" type="button" class="btn-primary">Pilih / Simpan</button>
                    <a href="index.xhtml" class="btn-secondary">Lihat Pilihan Lain</a>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/detail.js"></script>
</body>
</html>
